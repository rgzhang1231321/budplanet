<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>替你记着吃药 · 体验补全原型</title>
<!--
  ============================================================================
  替你记着吃药 · 体验补全原型（2026-11-02）
  ----------------------------------------------------------------------------
  ⚠ 这是原型，不是生产代码。
     · 所有数据为示意，不含任何真实用户信息，不可直接接入业务逻辑。
     · 单文件、零外部依赖：不引 CDN、不引字体、不引图片；图标全部为内联 SVG。
     · 手机屏内严格模拟微信小程序浅色设计语言；屏外为深色外壳（适配深色 IDE）。

  配色来源：docs/UI-设计规范.md §3.1 色板、§3.2 字号阶梯
     --brand-500 #2E6BE6 / --brand-100 #EAF1FE
     --text-1 #1A1F26 / --text-2 #5C6B7A / --text-3 #8A94A0
     --bg-page #F4F6F8 / --bg-card #FFFFFF / --line #E8EDF2
     已服 #12A150 · 待服 空心圆 #A9B4C0 · 漏服 #E0402F + #FFF4F2 · 跳过 #E3E8ED
     警示（非错误态）#FF8A3D，文字档 #C25E17
  审查依据：docs/页面流程与功能审查-2026-11-02.md 第三、四、六节
  ============================================================================
-->
<style>
/* ============================================================
   0. 重置与设计令牌
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  /* 品牌 */
  --brand:#2E6BE6; --brand-600:#1E4FBF; --brand-100:#EAF1FE;
  /* 文字 */
  --text-1:#1A1F26; --text-2:#5C6B7A; --text-3:#8A94A0;
  /* 面 */
  --bg-page:#F4F6F8; --card:#FFFFFF; --line:#E8EDF2;
  /* 四态 */
  --taken:#12A150; --taken-ink:#0B7F38; --taken-bg:#F0FAF4;
  --pending:#A9B4C0;
  --missed:#E0402F; --missed-ink:#C22C1B; --missed-bg:#FFF4F2;
  --skipped:#E3E8ED; --skipped-ink:#7A8492;
  /* 警示（琥珀，非错误） */
  --warn:#FF8A3D; --warn-ink:#C25E17; --warn-bg:#FFF7F0;
  /* 形 */
  --r-card:12px; --r-elder:16px;
  --shadow:0 2px 12px rgba(17,34,51,.06);
  --shadow-elder:0 4px 20px rgba(17,34,51,.10), inset 0 0 0 1px #E8EDF2;
  /* 外壳 */
  --shell:#0E1116; --shell-line:#22282F; --shell-text:#E6EAEF; --shell-dim:#8A94A0;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--shell); color:var(--shell-text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,p,figure,figcaption{margin:0}
b,strong{font-weight:700}

/* ============================================================
   1. 页面外壳（深色）
   ============================================================ */
.wrap{max-width:1440px; margin:0 auto; padding:56px 40px 96px}

.hd{padding-bottom:36px; border-bottom:1px solid var(--shell-line)}
.eyebrow{
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:#6B7684; font-weight:600; margin-bottom:14px;
}
.hd h1{
  font-size:34px; line-height:1.25; font-weight:700; letter-spacing:-.01em;
  color:#FFFFFF; margin-bottom:12px;
}
.hd .sub{font-size:13px; color:var(--shell-dim); font-variant-numeric:tabular-nums}
.legend{display:flex; gap:22px; margin-top:18px; font-size:12px; color:#98A2AE}
.legend span{display:inline-flex; align-items:center; gap:7px}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block}
.dot.new{background:var(--taken)}
.dot.rework{background:var(--warn)}
.dot.same{background:#5A6470; box-shadow:inset 0 0 0 1.5px #8A94A0}

/* ============================================================
   2. 流程对照
   ============================================================ */
.flow{padding:38px 0 10px; border-bottom:1px solid var(--shell-line); margin-bottom:52px}
.flow-hd{
  font-size:12px; letter-spacing:.12em; color:#6B7684; font-weight:600;
  text-transform:uppercase; margin-bottom:22px;
}
.flow-row{display:flex; align-items:center; gap:14px; margin-bottom:18px}
.flow-row:last-child{margin-bottom:6px}
.flow-tag{
  flex:0 0 52px; font-size:11.5px; color:#6B7684; text-align:right;
  letter-spacing:.04em;
}
.flow-row.done .flow-tag{color:#8A94A0}
.flow-track{display:flex; align-items:center}
.node{
  width:124px; height:38px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:500; color:#C6CED8;
  background:#171C22; border:1px solid #2A313A;
  white-space:nowrap;
}
.flow-row.done .node{background:#151A20; color:#E6EAEF; border-color:#39424D}
.flow-row.done .node.acc{background:rgba(46,107,230,.14); border-color:rgba(46,107,230,.55); color:#9FC0F8}
.node.brk{
  width:124px; height:auto; padding:5px 6px; flex-direction:column; gap:1px;
  border:1px dashed rgba(224,64,47,.75); background:rgba(224,64,47,.10);
  color:#F07C6E; font-size:11.5px; line-height:1.3;
}
.node.brk i{font-style:normal; font-size:9.5px; color:#E0402F; letter-spacing:.02em}
.arw{width:20px; text-align:center; color:#414A55; font-size:13px; user-select:none}
.flow-row.done .arw{color:#5A6672}

/* ============================================================
   3. 屏阵
   ============================================================ */
.board{
  display:grid; grid-template-columns:repeat(auto-fit,375px);
  gap:64px 40px; justify-content:center; align-items:start;
}
.unit{display:flex; flex-direction:column; width:375px}
.unit.wide{width:790px; grid-column:span 2}

/* 手机框 */
.phone{
  position:relative; width:375px; height:812px; flex:0 0 auto;
  background:var(--bg-page); border-radius:40px; border:1px solid #2A3038;
  overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7);
}
.phone.elder{background:#FFFFFF}

/* 状态栏 44px */
.sb{
  flex:0 0 44px; height:44px; display:flex; align-items:center;
  justify-content:space-between; padding:0 22px 0 26px;
  font-size:14px; font-weight:600; color:var(--text-1);
  font-variant-numeric:tabular-nums; letter-spacing:.01em;
}
.sb svg{display:block}

/* 导航栏 */
.nav{
  flex:0 0 48px; height:48px; display:flex; align-items:center;
  justify-content:space-between; padding:0 12px; background:transparent;
}
.nav.solid{background:var(--card); border-bottom:1px solid var(--line)}
.nav-c{flex:1; text-align:center; min-width:0}
.nav-t{font-size:16px; font-weight:600; color:var(--text-1); line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-s{font-size:10.5px; color:var(--text-3); margin-top:2px; font-variant-numeric:tabular-nums}
.nav-l2{min-width:0}
.nav-l2 .nav-t{display:flex; align-items:center; gap:3px}
.nav-ic{width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  color:var(--text-1); flex:0 0 24px}
.nav-plus{width:26px; height:26px; border-radius:50%; background:var(--card);
  display:flex; align-items:center; justify-content:center; color:var(--text-1);
  box-shadow:var(--shadow)}

/* 内容区 */
.content{
  flex:1 1 auto; min-height:0; overflow:hidden;
  padding:10px 12px 0; display:flex; flex-direction:column; gap:8px;
}
.content.flush{padding:0}

/* tabBar 83px */
.tabbar{
  flex:0 0 83px; height:83px; background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:8px 0 0;
}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#9AA5B1}
.tab.on{color:var(--brand)}
.tab span{font-size:10px; font-weight:500; line-height:1}

/* ============================================================
   4. 共用组件
   ============================================================ */
.card{background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow)}

/* 状态徽标：颜色 + 形状 + 文字 三重编码 */
.st{
  display:inline-flex; align-items:center; gap:3px; height:18px; padding:0 6px;
  border-radius:9px; font-size:10.5px; font-weight:600; line-height:1; white-space:nowrap;
}
.st i{font-style:normal; font-size:9px; line-height:1}
.st-taken{background:var(--taken); color:#fff}
.st-pend{background:#fff; border:1px solid var(--pending); color:#4A5969; font-weight:500; padding:0 5px}
.st-miss{background:var(--missed); color:#fff}
.st-skip{background:var(--skipped); color:var(--skipped-ink)}
.rg{width:7px; height:7px; border:1.4px solid var(--pending); border-radius:50%; display:inline-block; flex:0 0 7px}
.st.big{height:24px; font-size:13px; border-radius:12px; padding:0 10px; gap:5px}
.st.big .rg{width:9px; height:9px; border-width:1.8px; flex:0 0 9px}
.st.big i{font-size:11px}

/* 标签 chip（饭后 / 爸 / 长期用药） */
.tag{
  display:inline-flex; align-items:center; height:17px; padding:0 5px; border-radius:4px;
  background:#F4F6F8; color:var(--text-2); font-size:10px; font-weight:500; white-space:nowrap;
}
.tag.blue{background:var(--brand-100); color:var(--brand-600)}

/* 按钮 */
.btn{
  display:flex; align-items:center; justify-content:center; width:100%;
  border:none; border-radius:10px; font-family:inherit; font-size:14px; font-weight:600;
  height:44px; cursor:default; letter-spacing:.01em;
}
.btn.primary{background:var(--brand); color:#fff}
.btn.ghost{background:#fff; color:var(--text-1); box-shadow:inset 0 0 0 1px #D6DEE7}
.btn.ghost-blue{background:#fff; color:var(--brand-600); box-shadow:inset 0 0 0 1px var(--brand)}
.btn-xs{
  display:inline-flex; align-items:center; justify-content:center; height:24px;
  padding:0 9px; border-radius:12px; border:none; font-family:inherit;
  font-size:10.5px; font-weight:600; white-space:nowrap; flex:0 0 auto;
}
.btn-xs.ghost{background:#fff; color:var(--text-2); box-shadow:inset 0 0 0 1px #D6DEE7}
.btn-xs.solid{background:var(--brand); color:#fff}
.btn-xs.blue{background:var(--brand-100); color:var(--brand-600); height:22px; padding:0 8px}
.btn-xs.line{background:#fff; color:var(--brand-600); box-shadow:inset 0 0 0 1px rgba(46,107,230,.45)}
.btn-xs.warn{background:#fff; color:var(--warn-ink); box-shadow:inset 0 0 0 1px rgba(255,138,61,.55)}

/* 细分割 */
.hr{height:1px; background:var(--line)}

/* 小字 */
.micro{font-size:10.5px; color:var(--text-3); line-height:1.5}
.micro.c{text-align:center}

/* ============================================================
   5. 屏 1 · 首页（子女端）
   ============================================================ */
.amber{
  display:flex; align-items:center; gap:7px; height:34px; flex:0 0 34px;
  background:var(--warn-bg); border-radius:8px; padding:0 8px 0 9px;
  box-shadow:inset 3px 0 0 var(--warn);
}
.amber-t{font-size:10.5px; color:#7A4A18; flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1}
.amber-a{font-size:10.5px; font-weight:700; color:var(--warn-ink); white-space:nowrap; flex:0 0 auto}
.amber-x{font-size:13px; color:#B08A63; line-height:1; flex:0 0 auto; padding-left:2px}

.ov{padding:10px 12px; flex:0 0 auto}
.ov-top{display:flex; align-items:flex-end; justify-content:space-between}
.ov-num{display:flex; align-items:baseline; gap:4px}
.ov-num b{font-size:24px; font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.ov-num .of{font-size:13px; font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums}
.ov-num .lb{font-size:11px; color:var(--text-3); margin-left:2px}
.ov-pct{font-size:21px; font-weight:700; color:var(--brand); line-height:1; font-variant-numeric:tabular-nums}
.ov-pct span{font-size:11px; font-weight:600; margin-left:1px}
.bar{height:5px; border-radius:3px; background:var(--brand-100); overflow:hidden; margin:8px 0 7px}
.bar i{display:block; height:100%; border-radius:3px; background:var(--brand)}
.ov-bot{display:flex; align-items:center; justify-content:space-between; font-size:10.5px; line-height:1}
.ov-bot .who{color:var(--text-2); font-variant-numeric:tabular-nums}
.ov-warn{color:var(--missed); font-weight:600}

.missed{
  display:flex; align-items:center; gap:7px; height:44px; flex:0 0 44px;
  background:var(--missed-bg); border-radius:8px; padding:0 8px 0 10px;
  box-shadow:inset 3px 0 0 var(--missed);
}
.missed-t{font-size:11px; color:#3A1B16; flex:1 1 auto; min-width:0; line-height:1.25}
.missed-btns{display:flex; gap:5px; flex:0 0 auto}

/* 设置清单 */
.cl{padding:10px 12px 9px; flex:0 0 auto}
.cl-hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:5px}
.cl-hd span:first-child{font-size:13px; font-weight:600; color:var(--text-1)}
.cl-cnt{font-size:10.5px; color:var(--text-3); font-variant-numeric:tabular-nums}
.cl-row{display:flex; align-items:center; gap:8px; height:24px}
.cl-row .mk{
  width:14px; height:14px; flex:0 0 14px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; line-height:1;
}
.cl-row.done .mk{background:#E7F6ED; color:var(--taken-ink)}
.cl-row.done .tx{font-size:12px; color:#9AA5B1; text-decoration:line-through}
.cl-row.now .mk{box-shadow:inset 0 0 0 1.2px var(--text-1); color:var(--text-1); background:#fff}
.cl-row.now .tx{font-size:12px; font-weight:700; color:var(--text-1)}
.cl-row .tx{flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cl-ft{font-size:10px; color:var(--text-3); margin-top:5px; line-height:1.4}

/* 服药人分组 */
.grp{padding:9px 12px 7px; flex:0 0 auto}
.grp-hd{display:flex; align-items:baseline; gap:6px; height:19px}
.grp-nm{font-size:13px; font-weight:600; color:var(--text-1)}
.grp-ct{font-size:10.5px; color:var(--text-3); font-variant-numeric:tabular-nums}
.drow{display:flex; align-items:center; gap:7px; height:38px}
.drow + .drow{border-top:1px solid var(--line)}
.d-t{font-size:11px; color:var(--text-2); flex:0 0 33px; font-variant-numeric:tabular-nums}
.d-n{font-size:12.5px; color:var(--text-1); flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.d-d{font-size:10.5px; color:var(--text-3); flex:0 0 auto; font-variant-numeric:tabular-nums}

/* 屏 3 背景压暗 */
.mask{position:absolute; inset:0; background:rgba(0,0,0,.45)}
.bsheet{
  position:absolute; left:0; right:0; bottom:0; background:#fff;
  border-radius:20px 20px 0 0; padding:8px 20px 22px;
  box-shadow:0 -8px 32px rgba(17,34,51,.18);
}
.grab{width:36px; height:4px; border-radius:2px; background:#E1E6EC; margin:0 auto 12px}
.bsheet h3{margin:0 0 12px; font-size:17px; font-weight:700; color:var(--text-1); letter-spacing:-.01em}
.bs-card{
  background:#F4F6F8; border-radius:10px; padding:10px 12px; margin-bottom:12px;
  display:flex; align-items:center; gap:10px;
}
.bs-time{font-size:16px; font-weight:700; color:var(--text-1); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.bs-med{flex:1 1 auto; min-width:0}
.bs-med b{display:block; font-size:13.5px; font-weight:600; color:var(--text-1); line-height:1.3}
.bs-note{font-size:11.5px; color:var(--text-2); line-height:1.65; margin-bottom:14px}
.bs-note b{color:var(--text-1); font-weight:600}
.bs-fine{font-size:10px; color:var(--text-3); line-height:1.5; margin-top:11px; text-align:center}
.bsheet .btn + .btn{margin-top:8px}
.bsheet .btn.ghost{height:42px; font-size:13.5px}

/* ============================================================
   6. 屏 2 · 提醒额度
   ============================================================ */
.q-hero{padding:18px 16px 16px; text-align:center; flex:0 0 auto}
.q-num{display:flex; align-items:baseline; justify-content:center; gap:4px}
.q-num b{font-size:68px; font-weight:700; line-height:.95; letter-spacing:-.04em;
  color:var(--warn-ink); font-variant-numeric:tabular-nums}
.q-cap{font-size:13.5px; color:var(--text-1); font-weight:600; margin-top:10px}
.q-sub{font-size:11px; color:var(--text-3); margin-top:3px}

.q-explain{background:var(--brand-100); border-radius:10px; padding:12px 13px; flex:0 0 auto}
.q-explain p{font-size:12px; color:#1B3E7C; line-height:1.55}
.q-explain .fine{font-size:10.5px; color:#4A6699; margin-top:5px}

.q-list{background:#fff; border-radius:12px; box-shadow:var(--shadow); padding:2px 12px; flex:0 0 auto}
.q-row{display:flex; align-items:center; gap:10px; height:62px}
.q-row + .q-row{border-top:1px solid var(--line)}
.q-ic{
  width:30px; height:30px; flex:0 0 30px; border-radius:9px; background:var(--brand-100);
  display:flex; align-items:center; justify-content:center; color:var(--brand);
}
.q-tx{flex:1 1 auto; min-width:0}
.q-tx b{display:block; font-size:13px; font-weight:600; color:var(--text-1); line-height:1.3}
.q-tx span{display:block; font-size:10.5px; color:var(--text-3); margin-top:2px}
.q-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto}
.q-state{font-size:11px; font-weight:600; font-variant-numeric:tabular-nums}
.q-state.warn{color:var(--warn-ink)}
.q-state.red{color:var(--missed)}
.q-state.gray{color:var(--text-3)}

.q-foot{flex:0 0 auto; margin-top:2px}
.q-foot .micro{margin-top:7px; font-size:10px; line-height:1.45}

/* ============================================================
   7. 屏 4 · 老人端打卡
   ============================================================ */
.e-c{padding:16px 20px 22px; background:#fff; gap:0}
.e-sum{font-size:20px; color:#0F1620; line-height:1.85; font-weight:500; letter-spacing:-.01em}
.e-sum b{font-size:38px; font-weight:700; line-height:1; margin:0 2px; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}

.e-card{
  position:relative; background:#fff; border-radius:var(--r-elder);
  box-shadow:var(--shadow-elder); padding:20px; margin-top:18px;
}
.e-when{font-size:14px; color:#414D5A; font-weight:500; font-variant-numeric:tabular-nums}
.e-name{font-size:38px; font-weight:700; line-height:1.22; color:#0F1620; margin-top:6px; letter-spacing:-.02em}
.e-dose{font-size:22px; font-weight:600; color:var(--brand-600); margin-top:4px; line-height:1.3}
.e-card .tag{height:22px; font-size:12px; padding:0 7px; border-radius:5px; margin-top:10px}
.e-card .st{position:absolute; top:18px; right:18px}

.e-mid{text-align:center; margin-top:26px}
.e-mid-1{font-size:20px; color:#0F1620; font-weight:600}
.e-mid-2{font-size:20px; color:var(--warn-ink); font-weight:600; margin-top:4px;
  font-variant-numeric:tabular-nums}

.e-btn{
  display:flex; align-items:center; justify-content:center; width:100%; border:none;
  border-radius:var(--r-elder); font-family:inherit; font-weight:600; letter-spacing:.02em;
}
.e-btn.off{height:80px; background:#EFF2F6; color:#9AA5B1; font-size:24px}
.e-btn.main{height:80px; background:var(--brand); color:#fff; font-size:24px;
  box-shadow:0 8px 22px rgba(46,107,230,.28)}
.e-btn.sec{height:56px; background:#fff; color:#0F1620; font-size:18px;
  box-shadow:inset 0 0 0 1.5px #C7CFD8; margin-top:12px}
.e-link{text-align:center; font-size:18px; color:var(--brand); font-weight:600; margin-top:16px}
.e-next{font-size:16px; color:#414D5A; text-align:center; margin-top:auto; padding-top:18px;
  font-variant-numeric:tabular-nums}
.e-who{font-size:16px; color:#414D5A; text-align:center; margin-top:6px}
.e-stack{display:flex; flex-direction:column; flex:1 1 auto; min-height:0; margin-top:auto}

/* ============================================================
   8. 屏 5 · 药品详情
   ============================================================ */
.m-head{display:flex; align-items:flex-start; gap:11px; padding:4px 2px 0; flex:0 0 auto}
.m-ic{
  width:46px; height:46px; flex:0 0 46px; border-radius:50%; background:var(--brand-100);
  display:flex; align-items:center; justify-content:center; color:var(--brand);
}
